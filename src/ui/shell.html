<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Drop — Your clipboard shelf</title><link rel="icon" href="mark.svg"><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header class="topbar"><a class="brand" href="https://antonni-code.dev/drop" target="_blank" rel="noopener noreferrer" aria-label="About Drop"><img src="mark.svg" width="24" height="24" alt=""><span>drop<span class="dot">.</span></span></a><div class="top-actions"><button id="pro" class="plan">Get Pro <span aria-hidden="true">↗</span></button><button id="settings" class="icon-button" aria-label="Settings">⚙</button></div></header>
<section class="intro"><p class="eyebrow">YOUR EVERYDAY SHELF</p><h1>A little less retyping.</h1><p>Keep the things you reach for.</p></section>
<button id="new-clip" class="composer"><span class="plus" aria-hidden="true">+</span><span>Drop something here</span><kbd>⌘ / Ctrl V</kbd></button>
<div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find a clip…" aria-label="Search clips" autocomplete="off"><kbd>/</kbd></div>
<div class="shelf-tools"><div class="modes" role="group" aria-label="Clip action"><button id="copy-mode" class="selected" aria-pressed="true">Copy</button><button id="paste-mode" aria-pressed="false">Quick Paste <span aria-hidden="true">↗</span></button></div><button id="filters-button" class="text-button">Filter <span aria-hidden="true">≡</span></button></div>
<div id="filters" class="filters" hidden><label>Type<select id="kind-filter"><option value="all">Everything</option><option value="text">Text</option><option value="link">Links</option><option value="code">Code</option></select></label><label>Order<select id="sort"><option value="recent">Recently used</option><option value="newest">Newest first</option><option value="manual">My order</option></select></label></div>
<nav id="collections" class="collections" aria-label="Collections" hidden></nav>
<section id="list" class="clip-list" aria-label="Saved clips" aria-busy="true"><p class="empty">Opening your shelf…</p></section>
<footer class="shelf-footer"><span id="usage">Five spaces. Yours to keep.</span><span class="local"><span aria-hidden="true">●</span> On this device</span></footer>
</main><div id="toast" role="status" class="toast" hidden><span></span><button hidden>Undo</button></div><dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog><input id="import-file" type="file" accept="application/json,.json" hidden><script type="module" src="popup.js"></script></body></html>
